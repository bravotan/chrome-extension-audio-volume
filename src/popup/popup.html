<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Volume Booster</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="header">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="22" height="22" />
        <span data-i18n="appName">Volume Booster</span>
      </div>
      <div class="header-actions">
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="en">EN</option>
          <option value="ja">日本語</option>
        </select>
        <button id="settingsBtn" class="icon-btn" data-i18n-title="openSettings" title="Open settings page" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.04 4.64a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.14.47.47.86.92 1.04H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="page-context" id="pageContext">
      <img id="favicon" class="favicon" alt="" width="20" height="20" />
      <div class="context-text">
        <div class="context-label" data-i18n="settingsForThisPage">Settings for this page</div>
        <div class="context-host" id="hostLabel">—</div>
      </div>
    </section>

    <p id="unsupportedNote" class="unsupported hidden" data-i18n="currentTabUnsupported">
      Volume control isn't available on this page
    </p>

    <div id="controls">
      <div class="field">
        <label for="scopeSelect" data-i18n="applyTo">Apply to</label>
        <select id="scopeSelect">
          <option value="domain" data-i18n="applyToDomain">All under this domain</option>
          <option value="path" data-i18n="applyToPath">This path only</option>
        </select>
      </div>

      <div class="volume-block">
        <div class="volume-readout" id="volumeReadout">100%</div>
        <input type="range" id="volumeSlider" min="0" max="500" step="5" value="100" />
        <div class="slider-ticks">
          <span>0%</span><span>100%</span><span>200%</span><span>300%</span><span>500%</span>
        </div>
        <div class="presets" id="presets">
          <button type="button" data-value="50">50%</button>
          <button type="button" data-value="100">100%</button>
          <button type="button" data-value="150">150%</button>
          <button type="button" data-value="200">200%</button>
        </div>
        <label class="mute-row">
          <input type="checkbox" id="muteCheckbox" />
          <span data-i18n="mute">Mute</span>
        </label>
      </div>
    </div>

    <section class="saved-list">
      <button type="button" id="savedToggle" class="saved-toggle">
        <span data-i18n="savedList">Saved list</span>
        <svg id="savedChevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>
      <div id="savedListBody" class="saved-list-body hidden">
        <p id="savedEmpty" class="empty-note hidden" data-i18n="noSavedDomains">No saved domains yet</p>
        <ul id="savedListItems" class="saved-list-items"></ul>
      </div>
    </section>

    <footer class="footer">
      <button type="button" id="openSettingsLink" class="link-btn" data-i18n="openSettings">Open settings page</button>
    </footer>
  </div>

  <script src="../lib/rules.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
